name: .NET CI

# Reusable workflow — called by a service repo as:
#
#   jobs:
#     build-and-test:
#       uses: aeroflow-air/aeroflow-workflows/.github/workflows/dotnet-ci.yml@v0.6.0
#       with:
#         solution: Your.Service.sln
#         # github-packages: true   # opt in to the org GitHub Packages feed
#       permissions:
#         contents: read
#         # packages: read          # required when github-packages is true
#
# Thin restore → build → test. No scanner theatre.
# validate-decisions.yml is separate and untouched.

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version for actions/setup-dotnet
        type: string
        required: false
        default: "8.0.x"
      solution:
        description: Path to the .sln (or .csproj). Empty runs at the repo root.
        type: string
        required: false
        default: ""
      github-packages:
        description: >
          If true, add the org GitHub Packages NuGet feed
          (https://nuget.pkg.github.com/aeroflow-air/index.json) and
          authenticate with GITHUB_TOKEN via NUGET_AUTH_TOKEN. The calling
          job must set permissions.packages: read. Default is false, so
          callers that only use nuget.org need no change.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        if: ${{ !inputs.github-packages }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup .NET (with GitHub Packages)
        if: ${{ inputs.github-packages }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          source-url: https://nuget.pkg.github.com/aeroflow-air/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: |
          if [ -n "${{ inputs.solution }}" ]; then
            dotnet restore "${{ inputs.solution }}"
          else
            dotnet restore
          fi

      - name: Build
        run: |
          if [ -n "${{ inputs.solution }}" ]; then
            dotnet build "${{ inputs.solution }}" --configuration Release --no-restore
          else
            dotnet build --configuration Release --no-restore
          fi

      - name: Test
        run: |
          if [ -n "${{ inputs.solution }}" ]; then
            dotnet test "${{ inputs.solution }}" --configuration Release --no-build --verbosity normal
          else
            dotnet test --configuration Release --no-build --verbosity normal
          fi
