name: Self-test

# This repo's own CI. Lints every workflow here, validates the workload
# manifest schema, and runs dotnet-ci.yml against a tiny sample, so a
# broken reusable workflow fails on its PR instead of in a caller after
# the next tag.
#
# Check-run names (required on main): `lint` and `dotnet-ci / build-and-test`.
# `workload-deploy / generate` also runs here; it is not required yet.
# The workload schema check is a step in `lint`, not a separate workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Official download script and binary, both pinned to the same release.
      # ubuntu-latest ships shellcheck, so run: blocks are checked too.
      - name: Download actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml

      # Same required check as actionlint. No second workflow.
      - name: Validate workload schema
        run: |
          python3 -m venv .schema-venv
          .schema-venv/bin/pip install --disable-pip-version-check 'jsonschema==4.23.0' 'PyYAML==6.0.2'
          .schema-venv/bin/python tests/workload-schema/validate.py

      # Same required check. Unit and golden-file tests for the generator.
      - name: Test workload generator
        run: .schema-venv/bin/python -m unittest discover -s tests/generator -v

  dotnet-ci:
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      solution: tests/sample/Sample.sln
    permissions:
      contents: read

  # Calls workload-deploy.yml against this repo's flight-status fixture, so the
  # generator, stand-in module and bicep build/lint are proven before a tag.
  workload-deploy:
    uses: ./.github/workflows/workload-deploy.yml
    with:
      workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest: tests/generator/manifests/svc-flight-status.yaml
    permissions:
      contents: read
