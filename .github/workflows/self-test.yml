name: Self-test

# This repo's own CI. Lints every workflow here, validates the workload
# manifest schema, and runs dotnet-ci.yml against a tiny sample, so a
# broken reusable workflow fails on its PR instead of in a caller after
# the next tag.
#
# Check-run names (required on main): `lint` and `dotnet-ci / build-and-test`.
# `dotnet-ci-with-feed` and `dotnet-ci-github-packages` also run here; they are
# not required yet (add them when tagging v0.6.0 if you want them to gate main).
# `workload-deploy / generate` also runs here; it is not required yet.
# The `sync-agent-skills-*` jobs prove sync-agent-skills.yml (clean passes,
# drift is caught, bump dry run re-syncs). Not required yet.
# The workload schema check is a step in `lint`, not a separate workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Official download script and binary, both pinned to the same release.
      # ubuntu-latest ships shellcheck, so run: blocks are checked too.
      - name: Download actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml

      # Same required check as actionlint. No second workflow.
      - name: Validate workload schema
        run: |
          python3 -m venv .schema-venv
          .schema-venv/bin/pip install --disable-pip-version-check 'jsonschema==4.23.0' 'PyYAML==6.0.2'
          .schema-venv/bin/python tests/workload-schema/validate.py

      # Same required check. Unit and golden-file tests for the generator.
      - name: Test workload generator
        run: .schema-venv/bin/python -m unittest discover -s tests/generator -v

      # Same required check. The C# port (generator/generate.cs, .NET 10
      # file-based app) must match the same golden files byte for byte.
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test C# workload generator (golden parity)
        run: tests/generator/run_csharp_golden.sh

      # Same required check. Unit tests for the agent-skills sync script (ADR-0023).
      - name: Test agent-skills sync script
        run: python3 -m unittest discover -s tests/agent-skills-sync -v

  dotnet-ci:
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      solution: tests/sample/Sample.sln
    permissions:
      contents: read
      packages: read

  # Same nuget.org-only sample, with the org feed enabled: proves the default
  # path still restores when github-packages is true.
  dotnet-ci-with-feed:
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      solution: tests/sample/Sample.sln
      github-packages: true
    permissions:
      contents: read
      packages: read

  # Restores AeroFlow.ServiceDefaults 0.1.0 from GitHub Packages.
  dotnet-ci-github-packages:
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      solution: tests/sample-github-packages/Sample.Packages.sln
      github-packages: true
    permissions:
      contents: read
      packages: read

  # Calls workload-deploy.yml against this repo's flight-status fixture, so the
  # generator, stand-in module and bicep build/lint are proven before a tag.
  workload-deploy:
    uses: ./.github/workflows/workload-deploy.yml
    with:
      workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest: tests/generator/manifests/svc-flight-status.yaml
    permissions:
      contents: read

  # Same proof for an events: manifest, so the Service Bus RBAC wiring and the
  # module's principalId output compile in bicep build before a tag.
  workload-deploy-events:
    uses: ./.github/workflows/workload-deploy.yml
    with:
      workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest: tests/generator/manifests/svc-baggage-reclaim.yaml
    permissions:
      contents: read

  # sync-agent-skills.yml against the real agent-skills v0.1.0 release and the
  # fixtures in tests/agent-skills-sync/fixtures. Each fixture excludes one
  # platform skill and carries a squad-owned skill the sync must ignore.
  # Check mode with only contents: read proves the read-only caller path.
  sync-agent-skills-clean:
    uses: ./.github/workflows/sync-agent-skills.yml
    with:
      mode: check
      workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      path: tests/agent-skills-sync/fixtures/clean
    permissions:
      contents: read

  # The drift fixture has an edited file, a missing skill and an excluded
  # skill present. fail-on-drift: false reports instead of failing, so the
  # assert job can prove drift was detected without a red run.
  sync-agent-skills-drift:
    uses: ./.github/workflows/sync-agent-skills.yml
    with:
      mode: check
      workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      path: tests/agent-skills-sync/fixtures/drift
      fail-on-drift: false
    permissions:
      contents: read

  # Bump mode, dry run: latest-release lookup and re-sync of the drift fixture,
  # without pushing or opening a PR.
  sync-agent-skills-bump-dry-run:
    uses: ./.github/workflows/sync-agent-skills.yml
    with:
      mode: bump
      workflows_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      path: tests/agent-skills-sync/fixtures/drift
      dry-run: true
    permissions:
      contents: read

  sync-agent-skills-assert:
    name: sync-agent-skills assert
    needs: [sync-agent-skills-clean, sync-agent-skills-drift, sync-agent-skills-bump-dry-run]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Clean passes, drift is caught, bump would re-sync
        env:
          CLEAN: ${{ needs.sync-agent-skills-clean.outputs.drift }}
          DRIFT: ${{ needs.sync-agent-skills-drift.outputs.drift }}
          CHANGED: ${{ needs.sync-agent-skills-bump-dry-run.outputs.changed }}
          VERSION: ${{ needs.sync-agent-skills-clean.outputs.version }}
        run: |
          echo "clean drift=$CLEAN, drift fixture drift=$DRIFT, bump changed=$CHANGED, pinned=$VERSION"
          [ "$CLEAN" = "false" ] || { echo "::error::clean fixture should be in sync"; exit 1; }
          [ "$DRIFT" = "true" ] || { echo "::error::drift fixture should be reported as drift"; exit 1; }
          [ "$CHANGED" = "true" ] || { echo "::error::bump dry run should re-sync the drift fixture"; exit 1; }
