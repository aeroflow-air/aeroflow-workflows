name: Label AI assistance self-test

on:
  push:
    paths:
      - "scripts/label_ai_assistance.py"
      - "tests/label-ai-assistance/**"
      - ".github/workflows/label-ai-assistance.yml"
      - ".github/workflows/label-ai-assistance-self-test.yml"
  pull_request:
    paths:
      - "scripts/label_ai_assistance.py"
      - "tests/label-ai-assistance/**"
      - ".github/workflows/label-ai-assistance.yml"
      - ".github/workflows/label-ai-assistance-self-test.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run detector unit tests
        run: python3 tests/label-ai-assistance/test_label_ai_assistance.py -v
